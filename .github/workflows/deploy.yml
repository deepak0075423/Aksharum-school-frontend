# Builds the web app and puts it live on the EC2 server on every push to main.
#
#   push to main ─▶ npm ci + vite build (production URLs) ─▶ upload ─▶
#   deploy/server-install.sh swaps it into the folder the site is served from
#   (production: ~/Aksharum-school-frontend/dist, served by `pm2 serve` on
#   port 3000 behind nginx — found automatically) ─▶
#   checks https://app.aksharum.com serves the new build
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   EC2_HOST      the server's address (13.50.231.82)
#   EC2_USER      the login used over SSH: ec2-user (the server runs Amazon Linux)
#   EC2_SSH_KEY   the whole private key file (.pem), BEGIN/END lines included
# Optional repository variables (… → Variables) — the defaults are what the
# live site used on Nov 17 2026:
#   VITE_API_URL         https://api.aksharum.com/api
#   VITE_WS_GATEWAY_URL  https://app.aksharum.com
#   SITE_URL             https://app.aksharum.com
#   FRONTEND_DIR         the folder the site is served from — only if the
#                        deploy cannot find it from nginx + pm2
#
# Run it by hand: Actions → Deploy web app → Run workflow.
# Roll back: re-run an older successful run (it rebuilds that commit).
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.aksharum.com/api' }}
      VITE_WS_GATEWAY_URL: ${{ vars.VITE_WS_GATEWAY_URL || 'https://app.aksharum.com' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://app.aksharum.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check the build points at production
        run: |
          grep -rqF "$VITE_API_URL" dist/assets || { echo "::error::The build does not contain VITE_API_URL ($VITE_API_URL)"; exit 1; }
          if grep -rlE 'localhost:(4000|5000)' dist/assets; then
            echo "::error::The files above still point at a local development server"; exit 1
          fi
          tar -czf "$RUNNER_TEMP/web.tgz" -C dist .
          echo "Build $(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1), $(du -sh dist | cut -f1)"

      - name: Connect to the server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          for v in EC2_HOST EC2_USER EC2_SSH_KEY; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The fingerprint is public — printing it shows WHICH key the secret holds.
          if ! pub="$(ssh-keygen -y -f ~/.ssh/deploy_key 2>/dev/null)"; then
            echo "::error::EC2_SSH_KEY is not a usable private key — paste the whole .pem file, from the -----BEGIN line to the -----END line, with its line breaks (on the Mac: pbcopy < ~/.ssh/aksharum.pem, then paste into the secret)"
            exit 1
          fi
          fp="$(printf '%s\n' "$pub" | ssh-keygen -lf - | cut -d' ' -f2)"
          echo "EC2_SSH_KEY fingerprint: $fp"
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$EC2_HOST/22" 2>/dev/null; then
            echo "::error::Cannot reach $EC2_HOST on port 22 from GitHub Actions. In the EC2 security group, allow inbound SSH (port 22) from anywhere — the key still guards the login."
            exit 1
          fi
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host server
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          if ! err="$(ssh server true 2>&1)"; then
            echo "$err"
            echo "::error::SSH login as $EC2_USER@$EC2_HOST was refused ($(printf '%s' "$err" | tail -1)). EC2_SSH_KEY holds key $fp — on Nov 17 2026 the server accepted only aksharum.pem, SHA256:HZLWh7d0ouwRFrbUw0w7VIMNKwZ/gMeDbuD+dgtsTw4. EC2_USER must be ec2-user."
            exit 1
          fi
          echo "Connected to $EC2_USER@$EC2_HOST"

      - name: Install on the server
        env:
          FRONTEND_DIR: ${{ vars.FRONTEND_DIR }}
        run: |
          remote="/tmp/aksharum-web-$GITHUB_SHA.tgz"
          scp -q "$RUNNER_TEMP/web.tgz" "server:$remote"
          domain="${SITE_URL#*://}"; domain="${domain%%/*}"
          ssh server "bash -s -- $(printf '%q ' "$remote" "$domain" "$FRONTEND_DIR")" < deploy/server-install.sh

      - name: Check the live site serves this build
        run: |
          want="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)"
          got=""
          for i in 1 2 3 4 5 6; do
            got="$(curl -fsS -m 10 -H 'Cache-Control: no-cache' "$SITE_URL/?deploy=$GITHUB_SHA" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)"
            [ "$got" = "$want" ] && { echo "✅ $SITE_URL serves $want"; exit 0; }
            sleep 5
          done
          echo "::error::$SITE_URL serves '${got:-nothing}', not the new '$want' — the files went into a folder this site is not served from. Set the repository variable FRONTEND_DIR."
          exit 1
